<!DOCTYPE html>
 
<!--

This is derived from the Wacom Scribble Demo: https://github.com/Wacom-Developer/wacom-device-kit-web

Key differences
- Basic cleanup and refactoring
- Does not have different brushs colors. The brush colors are static.
- Removed any IE-specific code

-->
<html>
<head>
	<script src="utils.js"></script> 

	<title>7P HTML Tablet tester</title>
	<style>

		* {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			font-size: 12px; /* Sets default font size for all non-heading text */
		}

		h1, h2, h3, p {
			padding: 0;
			margin: 0;
		}

		.canvasDiv {
			text-align: center;
			margin-left: auto;
			margin-right: auto;
		}

		.monospace {
			font-family: "Consolas", "Monaco", "Courier New", Courier, monospace;
		}

		div {
			/*border: 1px solid black;*/
			padding: 5px;
			padding-top: 5px;
			margin-bottom: 5px;
		}

		#myCanvas {
			touch-action: none; /*prevent canvas scrolling and system touch behavior*/
			display: block;
			/* This doesn't ensure background color saved in image.
				background-color: tan;
				See https://stackoverflow.com/questions/6957034/save-canvas-with-background-image
			*/
		}
	</style>




</head>


<body onload="initPage()" onresize="setCanvasProps()" oncontextmenu="return false;">
	<div class='parent'>
		<h2 >SevenPens Tablet Tester</h2>
		<p>
			<a href="https://thesevenpens.github.io/HtmlTabletTester/" target="_blank" rel="noopener noreferrer" >Docs</a>
			|
			<a href="https://github.com/TheSevenPens/HtmlTabletTester" target="_blank" rel="noopener noreferrer" >Code</a>

		</p>

		<p>
			Position: <label id="posLabel"> <span id="posVal" class="monospace">---</span> </label> |
			Pressure: <label id="pressureLabel"> <span id="pressureVal" class="monospace">---</span> </label> |
			Tilt: <label id="tiltLabel"> <span id="tiltVal" class="monospace">---</span> </label>	|
			Size: <label id="sizeLabel"> <span id="sizeVal" class="monospace">---</span></label>	|
		</p>
		
	</div>

	<div>
		<button type="button" onclick="clearCanvas()">Clear</button>
		<button type="button" onclick="saveCanvas()">Save</button>

		<label>Size </label>
		<select id="brushSizeSelect" value="brushSize" onchange="update_paint_settings_from_ui()">
        	<option value="1">1px</option>
        	<option value="5">5px</option>
        	<option value="10">10px</option>
        	<option value="50" selected >50px</option>
        	<option value="100">100px</option>
        	<option value="300">300px</option>
    	</select>

		<label>Scale size by </label>
		<select id="brushSizeControlSelect" value="brushSizeControl" onchange="update_paint_settings_from_ui()">
        	<option value="USER">Don't scale</option>
        	<option value="PRESSURE" selected>Pressure</option>
        	<option value="TILT">Tilt</option>
    	</select>

		<label>Color </label>
		<select id="brushColorControlSelect" value="brushColorControl" onchange="update_paint_settings_from_ui()">
        	<option value="DEFAULT" selected>Black</option>
        	<option value="RED">Red</option>
        	<option value="PRESSURE">Pressure</option>
        	<option value="TILT">Tilt</option>
        	<option value="ERASER">Eraser</option>
    	</select>

	</div>

	<div class="canvasDiv">
		<canvas id="myCanvas" height="450" style="border:5px solid #d1d1d1;">
			Your browser does not support the canvas element.
		</canvas>
	</div>

	<a id="link"></a>

	<script src="tablet_tester_app.js"></script>
</body>
</html>
